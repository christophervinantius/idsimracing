name: Post Weekly Schedule to Discord

on:
  schedule:
    # Runs every Monday at 05:00 UTC (12:00 PM / 12:00 GMT+7)
    - cron: '0 5 * * 1'
  workflow_dispatch:
    # Allows manual trigger anytime from the GitHub Actions UI tab

jobs:
  post-weekly-schedule:
    name: Trigger Weekly Discord Schedule Broadcast
    runs-on: ubuntu-latest
    steps:
      - name: Send Weekly Schedule Request
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://idsimracing.com' }}
          DISCORD_CRON_SECRET: ${{ secrets.DISCORD_CRON_SECRET }}
        run: |
          ENDPOINT="${SITE_URL%/}/api/discord/weekly-schedule"
          echo "Sending weekly schedule request to: $ENDPOINT"

          if [ -n "$DISCORD_CRON_SECRET" ]; then
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$ENDPOINT" \
              -H "Content-Type: application/json" \
              -H "x-cron-secret: $DISCORD_CRON_SECRET")
          else
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$ENDPOINT" \
              -H "Content-Type: application/json")
          fi

          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d':' -f2)

          echo "Response Body: $BODY"
          echo "HTTP Status: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Weekly schedule check completed successfully!"
          else
            echo "Failed to broadcast weekly schedule (HTTP $STATUS)"
            exit 1
          fi
